[project]
name = "dealgom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hyojeonglee", email = "hyon2224@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "honcho>=2.0.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "redis>=8.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
dealgom = "dealgom:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
